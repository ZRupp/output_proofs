services:
  benchmark:
    build:
      context: .
      args:
        - BASE_IMAGE=${BASE_IMAGE:-rocm/pytorch:rocm7.2_ubuntu22.04_py3.10_pytorch_release_2.9.1}
    environment:
      - INFERENCE_MODEL=${INFERENCE_MODEL:-gpt2}
      - FORMALIZER_MODEL=${FORMALIZER_MODEL:-Goedel-LM/Goedel-Formalizer-V2-8B}
      - HF_TOKEN=${HF_TOKEN:-}
      - DEVICE=${DEVICE:-auto}
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
    volumes:
      - ./results:/app/results
      - ~/.cache/huggingface:/root/.cache/huggingface
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    security_opt:
      - seccomp=unconfined

  # CPU-only profile for testing/dry-run without GPU
  benchmark-cpu:
    build:
      context: .
      args:
        - BASE_IMAGE=${BASE_IMAGE:-rocm/pytorch:rocm7.2_ubuntu22.04_py3.10_pytorch_release_2.9.1}
    environment:
      - INFERENCE_MODEL=${INFERENCE_MODEL:-gpt2}
      - FORMALIZER_MODEL=${FORMALIZER_MODEL:-Goedel-LM/Goedel-Formalizer-V2-8B}
      - HF_TOKEN=${HF_TOKEN:-}
      - DEVICE=cpu
    volumes:
      - ./results:/app/results
      - ~/.cache/huggingface:/root/.cache/huggingface
